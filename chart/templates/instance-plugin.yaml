{{- if .Values.instancePlugin.enabled }}
{{- /*
OxideInstance convergence plugin (see values.yaml instancePlugin). The instance
RestDefinition's OAS servers[0].url points here (chart/assets/instance.yaml);
the plugin forwards the bearer token to oxide.apiUrl and adds attach+start
reconcile so an instance converges to running regardless of apply ordering.
*/ -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-instance-plugin
  labels:
    {{- include "krateo-oxide-operator-kog.labels" . | nindent 4 }}
    app.kubernetes.io/component: instance-plugin
spec:
  replicas: {{ .Values.instancePlugin.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-instance-plugin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-instance-plugin
    spec:
      containers:
        - name: plugin
          image: "{{ .Values.instancePlugin.image.repository }}:{{ .Values.instancePlugin.image.tag }}"
          imagePullPolicy: {{ .Values.instancePlugin.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: OXIDE_API_URL
              value: {{ .Values.oxide.apiUrl | quote }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-instance-plugin
  labels:
    {{- include "krateo-oxide-operator-kog.labels" . | nindent 4 }}
    app.kubernetes.io/component: instance-plugin
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-instance-plugin
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
